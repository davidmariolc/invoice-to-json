<svg xmlns="http://www.w3.org/2000/svg" width="600" height="740" viewBox="0 0 600 740" fill="none">
  <title>Factura de ejemplo DEMO-000123</title>
  <desc>Datos ficticios. Empresa Ejemplo factura a Cliente Demo dos servicios de prueba a 50 soles. Subtotal 100, IGV 18 y total 118 soles.</desc>
  <rect x="1" y="1" width="598" height="738" fill="white" stroke="#d4d4d4" stroke-width="2"/>
